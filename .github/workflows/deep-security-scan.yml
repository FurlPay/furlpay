# ---------------------------------------------------------------------------
# Deep Security Scanning — SAST + Secret Scanning + License Compliance
#
# Runs Semgrep (SAST) on every PR and nightly for deep analysis.
# Catches code-level vulnerabilities that npm audit can't find:
#   - SSRF, XSS, SQL injection, hardcoded secrets
#   - Crypto misuse, insecure randomness
#   - Path traversal, open redirects
#   - Missing input validation patterns
# ---------------------------------------------------------------------------
name: Deep Security Scan (SAST)

on:
  pull_request:
  schedule:
    - cron: "30 6 * * *" # Daily 06:30 UTC = 12:00 PM IST (after npm audit)

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # -----------------------------------------------------------------------
  # Semgrep SAST — pattern-based static analysis
  # Free for up to 10 contributors / 50 repos
  # -----------------------------------------------------------------------
  semgrep:
    name: "🔬 Semgrep SAST Scan"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        env:
          # Use Semgrep's curated rulesets for maximum coverage
          SEMGREP_RULES: >-
            p/javascript
            p/typescript
            p/nextjs
            p/owasp-top-ten
            p/security-audit
            p/secrets
            p/xss
            p/sql-injection
            p/command-injection
            p/crypto
            p/react
          SEMGREP_TIMEOUT: 300
        run: |
          semgrep ci \
            --sarif --output=semgrep-results.sarif \
            --exclude="node_modules" \
            --exclude=".next" \
            --exclude="dist" \
            --exclude="*.test.*" \
            --exclude="*.spec.*" \
            --severity ERROR \
            --severity WARNING \
            2>&1 | tee semgrep-output.txt

          # Count findings
          ERRORS=$(grep -c "severity: ERROR" semgrep-output.txt || echo "0")
          WARNINGS=$(grep -c "severity: WARNING" semgrep-output.txt || echo "0")
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep-results.sarif
            semgrep-output.txt
          retention-days: 30

      - name: Discord alert on findings
        if: steps.semgrep.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_SECURITY_WEBHOOK }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0

          ERRORS="${{ steps.semgrep.outputs.errors }}"
          WARNINGS="${{ steps.semgrep.outputs.warnings }}"

          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"🔬 SAST Alert — Code Vulnerabilities Detected\",
              \"color\": 15548997,
              \"fields\": [
                {\"name\": \"Errors\", \"value\": \"$ERRORS\", \"inline\": true},
                {\"name\": \"Warnings\", \"value\": \"$WARNINGS\", \"inline\": true},
                {\"name\": \"Scanner\", \"value\": \"Semgrep (OWASP + secrets + crypto)\", \"inline\": false},
                {\"name\": \"Branch\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                {\"name\": \"Report\", \"value\": \"[View in GitHub Security Tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning)\", \"inline\": false}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$DISCORD_WEBHOOK"

      # Post findings as PR comment for immediate developer feedback
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.semgrep.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('semgrep-output.txt', 'utf8');
            const findings = output.split('\n').filter(l => l.includes('severity:')).slice(0, 10);
            const body = `## 🔬 Semgrep Security Scan Results\n\n⚠️ **Security issues detected.** Please review before merging.\n\n\`\`\`\n${findings.join('\n')}\n\`\`\`\n\n[View full report in the Security tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning)`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # Propagate Semgrep failure so the run actually goes red.
      # This runs AFTER Discord alerts and artifact uploads have completed.
      - name: Fail if Semgrep found issues
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "❌ Semgrep found security issues — failing the workflow."
          exit 1

  # -----------------------------------------------------------------------
  # License compliance — block copyleft/unknown licenses in prod deps
  # -----------------------------------------------------------------------
  license-check:
    name: "📜 License Compliance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts

      - name: Check licenses
        id: license
        continue-on-error: true
        run: |
          npx license-checker --production --failOn \
            "GPL-2.0-only;GPL-3.0-only;AGPL-3.0-only;SSPL-1.0;EUPL-1.1;EUPL-1.2" \
            --summary > license-report.txt 2>&1
          echo "status=$?" >> $GITHUB_OUTPUT
          cat license-report.txt

      - name: Discord alert on copyleft license
        if: steps.license.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_SECURITY_WEBHOOK }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"📜 License Compliance Alert\",
              \"description\": \"A production dependency uses a copyleft license (GPL/AGPL/SSPL). This may require FurlPay to open-source its code.\",
              \"color\": 16776960,
              \"fields\": [
                {\"name\": \"Action\", \"value\": \"Review the license-report artifact and replace the offending package.\", \"inline\": false},
                {\"name\": \"Report\", \"value\": \"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": false}
              ]
            }]
          }" "$DISCORD_WEBHOOK"
