name: OpenSSF Scorecard

# Supply-chain health metrics from the OpenSSF (ossf/scorecard). It grades the
# things a consumer cannot see by reading the code: whether releases are signed,
# whether dependencies are pinned, whether branch protection is on, whether
# dangerous workflow patterns are present.
#
# WHY THIS AND NOT ANOTHER BADGE. Scorecard is measured, not self-declared. The
# score comes from an independent analysis of this repository, so it cannot be
# improved by asserting anything — only by changing the repository. That is
# exactly why it carries weight with the people who check it, and why a low
# score is useful information rather than an embarrassment.
#
# Expect the first run to score poorly. Several checks (Branch-Protection,
# Signed-Releases, Pinned-Dependencies) fail by default and are fixed by
# repository settings rather than by code. Read the SARIF output in the Security
# tab and work down it.
#
# `publish_results: true` sends the score to the public OpenSSF API, which is
# what makes the README badge and deps.dev entry work. It publishes the SCORE,
# never the source.

on:
  branch_protection_rule:
  schedule:
    # Weekly. Scorecard reflects repository configuration more than code, so it
    # drifts on settings changes that no commit would trigger.
    - cron: "27 4 * * 1"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Skip on forks: publish_results would fail without the upstream identity,
    # and a fork's score is not meaningful anyway.
    #
    # Skip while the repository is PRIVATE. Scorecard reads commit history and
    # branch-protection state through the GitHub GraphQL API, which the default
    # Actions token cannot reach on a private repo — the run dies with
    # "githubv4.Query: Resource not accessible by integration" every single
    # time. That is a permanent red check reporting nothing about the code, and
    # a check that can never pass is worse than no check: it trains everyone to
    # ignore a failing badge.
    #
    # Written as a visibility test rather than deleting the workflow, so the
    # analysis starts running by itself the day this repo is made public.
    if: >-
      github.event.repository.fork == false &&
      github.event.repository.visibility == 'public'
    permissions:
      # Upload the SARIF result to the Security tab.
      security-events: write
      # OIDC — required by publish_results to attest the score came from here.
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Pinned to a tag that exists: ossf/scorecard-action publishes v2.x.y tags
      # but no floating `v2`, so `@v2` failed to resolve on every run since this
      # workflow was added — the job never got as far as scoring anything.
      - name: Run analysis
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Retained as an artifact as well as in the Security tab: code scanning
      # alerts age out, and a grant or enterprise review may ask for a specific
      # historical run.
      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: results.sarif
