# ---------------------------------------------------------------------------
# Security Audit — automated vulnerability scanning + Discord alerts
#
# Triggers:
#   • Every push to main / extension-redesign
#   • Every PR
#   • Daily at 06:00 UTC (11:30 AM IST)
#
# What it does:
#   1. npm audit (production deps only, high/critical threshold)
#   2. Secret leak scan (gitleaks)
#   3. License compliance check
#   4. Discord notification on ANY failure
# ---------------------------------------------------------------------------
name: Security Audit

on:
  push:
    branches: [main, extension-redesign]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # Daily 06:00 UTC = 11:30 AM IST

permissions:
  contents: read
  security-events: write

jobs:
  # -----------------------------------------------------------------------
  # Job 1: npm audit — catch vulnerable production dependencies
  # -----------------------------------------------------------------------
  npm-audit:
    name: "🔍 Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - run: npm install --ignore-scripts

      # continue-on-error lets the report upload + Discord alert run; the
      # final "Propagate failure" step re-fails the job so the run goes red
      # and the daily summary reports honestly.
      - name: Run npm audit (production deps)
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json > audit-report.json 2>&1 || true

          # Known-accepted advisories (no upstream fix / tracked major upgrade)
          # live in .github/audit-allowlist.json — they are reported but don't
          # fail the build, so real regressions stay signal, not noise.
          ALLOW=$(jq -c '[.[].name]' .github/audit-allowlist.json)

          # An advisory is ACCEPTED when either:
          #   a) the package is named in the allowlist, or
          #   b) it carries no advisory of its own and every parent it inherits
          #      from is named there.
          #
          # (b) exists so a package that is only guilty by association — next,
          # whose audit entry is nothing but its vendored postcss and optional
          # sharp — does not have to be named. Naming it would suppress every
          # FUTURE high against next itself, including a direct Next.js RCE,
          # which is precisely the masking we do not want. `via` distinguishes
          # the two: objects are real advisories, strings are parent packages.
          #
          # Deliberately one level deep. A chain (spl-token -> buffer-layout-utils
          # -> bigint-buffer) still names each link, so accepting the middle of a
          # chain stays an explicit, reviewed decision rather than a side effect.
          count() { # count()  severity  accepted(true|false)
            jq --argjson allow "$ALLOW" --arg sev "$1" --argjson inlist "$2" \
              '[.vulnerabilities // {} | to_entries[]
                | select(.value.severity == $sev)
                | . as $e
                | ( (($allow | index($e.key)) != null)
                    or
                    ( ([$e.value.via[] | select(type == "object")] | length) == 0
                      and ([$e.value.via[] | select(type == "string")] | length) > 0
                      and ( [$e.value.via[] | select(type == "string")]
                            | all(. as $p | ($allow | index($p)) != null) ) )
                  ) as $accepted
                | select($accepted == $inlist)
               ] | length' audit-report.json
          }
          CRITICAL=$(count critical false)
          HIGH=$(count high false)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-report.json)
          ACCEPTED=$(( $(count critical true) + $(count high true) ))

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          echo "accepted=$ACCEPTED" >> $GITHUB_OUTPUT

          echo "Accepted (allowlisted) high/critical advisories: $ACCEPTED"
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "❌ Found $CRITICAL critical and $HIGH high NON-allowlisted vulnerabilities"
            exit 1
          fi
          echo "✅ No non-allowlisted critical/high vulnerabilities"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

      - name: Discord alert on vulnerability
        if: steps.audit.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_SECURITY_WEBHOOK }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0

          CRITICAL="${{ steps.audit.outputs.critical }}"
          HIGH="${{ steps.audit.outputs.high }}"
          MODERATE="${{ steps.audit.outputs.moderate }}"

          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"🚨 FurlPay Security Alert — Vulnerable Dependencies\",
              \"color\": 15548997,
              \"fields\": [
                {\"name\": \"Critical\", \"value\": \"$CRITICAL\", \"inline\": true},
                {\"name\": \"High\", \"value\": \"$HIGH\", \"inline\": true},
                {\"name\": \"Moderate\", \"value\": \"$MODERATE\", \"inline\": true},
                {\"name\": \"Accepted (allowlisted)\", \"value\": \"${{ steps.audit.outputs.accepted }}\", \"inline\": true},
                {\"name\": \"Action\", \"value\": \"Run \`npm audit\` locally and apply fixes.\", \"inline\": false},
                {\"name\": \"Workflow\", \"value\": \"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": false}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$DISCORD_WEBHOOK"

      # Without this, continue-on-error would leave the job green even when
      # the audit found new vulnerabilities — masking every alert downstream.
      - name: Propagate audit failure
        if: steps.audit.outcome == 'failure'
        run: exit 1

  # -----------------------------------------------------------------------
  # Job 2: Secret leak detection — prevent API keys from being committed
  # -----------------------------------------------------------------------
  secret-scan:
    name: "🔑 Secret Leak Scan"
    runs-on: ubuntu-latest
    # On a pull_request event gitleaks-action enumerates the PR's commits via
    # GET /repos/{owner}/{repo}/pulls/{n}/commits, which the workflow-level
    # `contents: read` does not cover. Without this the action crashed with
    # "Resource not accessible by integration" (403) on every PR — red check,
    # no scan performed, and a "🔴 CRITICAL — Secret Leaked" Discord alert that
    # had nothing to do with secrets. Push events were unaffected, which is why
    # the same commit passed on push and failed on the PR.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A tag can be moved to different code after review; a SHA cannot.
      # Fails the job on any mutable `uses:` reference (SEC-P4-001).
      - name: Actions are pinned to commit SHAs
        run: node scripts/security/check-actions-pinned.mjs

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Discord alert on leaked secret
        if: steps.gitleaks.outcome == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_SECURITY_WEBHOOK }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0

          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"🔴 CRITICAL — Secret Leaked in Code\",
              \"description\": \"Gitleaks detected a potential secret or API key in the repository. **Rotate the exposed credential immediately.**\",
              \"color\": 15158332,
              \"fields\": [
                {\"name\": \"Branch\", \"value\": \"\`${{ github.ref_name }}\`\", \"inline\": true},
                {\"name\": \"Commit\", \"value\": \"\`${{ github.sha }}\`\", \"inline\": true},
                {\"name\": \"Workflow\", \"value\": \"[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": false}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$DISCORD_WEBHOOK"

      # Same masking issue as the audit job — a leak must turn the run red.
      - name: Propagate gitleaks failure
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1

  # -----------------------------------------------------------------------
  # Job 3: Daily health summary (runs only on schedule, not on push/PR)
  # -----------------------------------------------------------------------
  daily-summary:
    name: "📊 Daily Security Summary"
    # always(): without it a failed needs-job SKIPS this job entirely, so the
    # daily summary would go silent exactly on the days something is wrong.
    if: always() && github.event_name == 'schedule'
    needs: [npm-audit, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Send daily summary to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_SECURITY_WEBHOOK }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0

          AUDIT_STATUS="${{ needs.npm-audit.result }}"
          SECRET_STATUS="${{ needs.secret-scan.result }}"

          if [ "$AUDIT_STATUS" = "success" ] && [ "$SECRET_STATUS" = "success" ]; then
            COLOR=5763719  # green
            TITLE="✅ FurlPay Daily Security Check — All Clear"
            DESC="No vulnerabilities or leaked secrets detected."
          else
            COLOR=15548997  # red
            TITLE="⚠️ FurlPay Daily Security Check — Issues Found"
            DESC="One or more checks failed. Review the workflow run."
          fi

          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"$TITLE\",
              \"description\": \"$DESC\",
              \"color\": $COLOR,
              \"fields\": [
                {\"name\": \"Dependency Audit\", \"value\": \"$AUDIT_STATUS\", \"inline\": true},
                {\"name\": \"Secret Scan\", \"value\": \"$SECRET_STATUS\", \"inline\": true},
                {\"name\": \"Report\", \"value\": \"[View Full Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\", \"inline\": false}
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "$DISCORD_WEBHOOK"
