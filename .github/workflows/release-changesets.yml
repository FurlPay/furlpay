name: Release (changesets)

# Monorepo release automation. On every push to main, the changesets action
# either (a) opens/updates a "Version Packages" PR that bumps versions and
# changelogs from pending .changeset/*.md entries, or (b) when that PR merges,
# publishes every changed public package to npm with build provenance.
#
# Auth: prefers npm Trusted Publishing (OIDC — configure each package on
# npmjs.com under Settings > Trusted Publisher, pointing at this repo and this
# workflow file). NPM_TOKEN is the fallback for packages not yet migrated.
#
# Contributor flow:  npx changeset  ->  commit the generated .changeset/*.md
# with your PR  ->  merge  ->  the Version Packages PR carries the release.
on:
  push:
    branches:
      - main

concurrency: release-changesets

permissions:
  contents: write # version PR commits + git tags
  pull-requests: write # the Version Packages PR
  id-token: write # OIDC — npm provenance / trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - name: Test publishable packages
        run: npm test
      # Only attempt to publish when npm auth is actually configured. Without a
      # token (and until per-package OIDC trusted publishing is set up on
      # npmjs.com) `changeset publish` fails ENEEDAUTH and reds the run on every
      # push. Gating on NPM_TOKEN lets the action still open/refresh the
      # "Version Packages" PR from pending changesets; publishing turns on the
      # moment a token is added (or swap this for OIDC once configured).
      - id: publish_mode
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "cmd=npx changeset publish" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN not set — Release will manage the version PR but skip publishing."
          fi
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: ${{ steps.publish_mode.outputs.cmd }}
          title: "chore: version packages"
          commit: "chore: version packages"
        id: changesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # ── Supply-chain attestations ────────────────────────────────────────
      # Everything below runs ONLY when something was actually published, and
      # each step is individually gated on its own secret. A missing token
      # skips the step with a notice rather than reddening a release that
      # already succeeded — the same posture as the NPM_TOKEN gate above.

      - name: Generate SBOM (CycloneDX)
        if: steps.changesets.outputs.published == 'true'
        # An SBOM is the artifact that answers "were we affected?" on the day a
        # transitive dependency turns out to be compromised. Generated from the
        # resolved tree at publish time, because that is the only moment the
        # exact versions that shipped are still known.
        run: npx --yes @cyclonedx/cyclonedx-npm@latest --output-file sbom.cdx.json --output-format JSON || echo "::warning::SBOM generation failed — release not blocked"

      - name: Upload SBOM
        if: steps.changesets.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish to Forge registry
        # Forge (@forge-registry/cli, verified present on npm) adds the trust
        # layer npm does not: GitHub publisher verification, an Ed25519 publish
        # signature, and CVE/static scanning. It complements provenance rather
        # than replacing it — provenance proves WHERE a package was built,
        # publisher verification proves WHO owns it.
        #
        # Gated: without the token this is skipped, not failed. Verify the exact
        # env var against Forge's current docs — Trust Spec v0.1 is an open RFC
        # and this name comes from their published guidance, not a stable API.
        if: steps.changesets.outputs.published == 'true' && env.FORGE_TOKEN != ''
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_GITHUB_TOKEN }}
          FORGE_GITHUB_TOKEN: ${{ secrets.FORGE_GITHUB_TOKEN }}
        run: npx --yes @forge-registry/cli@latest publish || echo "::warning::Forge publish failed — npm release already succeeded"
