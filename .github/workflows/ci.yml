name: CI

# `extension-redesign` is the branch development actually happens on — it runs
# 18+ commits ahead of main for weeks at a time and is pushed to directly. With
# only [main] here, every one of those pushes ran NO CI, and the `Build web app`
# step below — the one that runs `next build` — first executed on Vercel.
# That is how commits 024b84b and 941ab52 shipped a lint error that broke two
# production deployments while `tsc --noEmit` and the unit tests stayed green.
#
# Dependabot and other short-lived branches are covered by `pull_request`, so
# they are not listed: adding them would double every run.
on:
  push:
    branches: [main, extension-redesign]
  pull_request:

# One run per ref. Pushing three times in a minute should leave one live run,
# not three competing for the same runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here builds and tests, none writes to the repo.
# Publishing and release automation live in release*.yml, which declare their
# own elevated scopes.
permissions:
  contents: read

jobs:
  web-and-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Lint web app
        run: npm run lint --workspace @furlpay/web
      - name: Type-check web app
        run: npm exec --workspace @furlpay/web -- tsc --noEmit
      # AGENTS.md rules 1 & 2: no mutating route may read an unvalidated body,
      # and sensitive public routes need a tighter budget than the middleware
      # baseline. Generic SAST (deep-security-scan.yml) can't express this.
      - name: Route security invariants
        run: node apps/web/scripts/check-route-security.mjs
      - name: Test web app (wallet-link security matrix + units)
        run: npm test --workspace @furlpay/web
      - name: Build web app
        run: npm run build --workspace @furlpay/web
      - name: Build & test Node SDK
        run: |
          npm run build --workspace @furlpay/furlpay-node
          npm test --workspace @furlpay/furlpay-node
      - name: Test compliance package
        run: npm test --workspace @furlpay/compliance
      - name: Test security package
        run: npm test --workspace @furlpay/security
      - name: Test ledger package
        run: npm test --workspace @furlpay/ledger

  # Security auditing moved to .github/workflows/security-audit.yml
  # which has proper failure handling + Discord notifications.

  go-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - working-directory: sdks/go
        run: go build ./...

  rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - working-directory: sdks/rust
        run: cargo test

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - working-directory: sdks/python
        run: python -c "import furlpay; b='{}'; assert furlpay.construct_event(b, furlpay.sign_payload(b,'s'), 's') == {}"
