name: CI

# `extension-redesign` is the branch development actually happens on — it runs
# 18+ commits ahead of main for weeks at a time and is pushed to directly. With
# only [main] here, every one of those pushes ran NO CI, and the `Build web app`
# step below — the one that runs `next build` — first executed on Vercel.
# That is how commits 024b84b and 941ab52 shipped a lint error that broke two
# production deployments while `tsc --noEmit` and the unit tests stayed green.
#
# Dependabot and other short-lived branches are covered by `pull_request`, so
# they are not listed: adding them would double every run.
on:
  push:
    branches: [main, extension-redesign]
  pull_request:

# One run per ref. Pushing three times in a minute should leave one live run,
# not three competing for the same runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here builds and tests, none writes to the repo.
# Publishing and release automation live in release*.yml, which declare their
# own elevated scopes.
permissions:
  contents: read

jobs:
  web-and-node:
    runs-on: ubuntu-latest
    # tsc walks the whole app in one process and the project outgrew Node's
    # default ~2GB old-space cap: the type-check step began dying with
    # "JavaScript heap out of memory" (exit 134) at 2040MB, which reads like a
    # type error in the log and is not one. Raised job-wide so `npm run build`
    # does not hit the same wall next.
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm install
      # These workspace packages publish their types from dist/, which is not
      # committed. Without building them first, `tsc --noEmit` below fails with
      # TS2307 (it did on every run since payouts/address.ts started importing
      # @furlpay/gateway), while `next build` passes because Vercel builds
      # dependencies first. Build them so the type-check gate checks code, not
      # build order.
      #
      # Compiled with the web app's pinned TypeScript (5.5.3, the one the
      # type-check below uses), not `npm run build`: the packages' own build
      # scripts resolve the root TypeScript 5.9, under which their Buffer usage
      # fails to type-check (a separate, pre-existing issue). All three emit
      # with 0 errors under 5.5.3.
      - name: Build workspace packages the web app imports (types live in dist/)
        run: |
          for pkg in gateway agent-trust furlpay-ap2; do
            node apps/web/node_modules/typescript/bin/tsc -p "packages/$pkg/tsconfig.json"
          done
      - name: Lint web app
        run: npm run lint --workspace @furlpay/web
      - name: Type-check web app
        run: npm exec --workspace @furlpay/web -- tsc --noEmit
      # AGENTS.md rules 1 & 2: no mutating route may read an unvalidated body,
      # and sensitive public routes need a tighter budget than the middleware
      # baseline. Generic SAST (deep-security-scan.yml) can't express this.
      # generateStays() fabricated names, ratings, review counts and nightly
      # prices from a hash seed and reached seven live routes, including the one
      # that priced a booking. Deleting the calls fixes today; this fixes the
      # next person who needs a hotel-shaped object in a hurry.
      - name: No synthetic travel data in production paths
        run: node apps/web/scripts/check-no-synthetic-travel.mjs

      - name: Route security invariants
        run: node apps/web/scripts/check-route-security.mjs
      # src/lib/geo/__tests__/nativeParity.spec.ts imports native-app/lib/geo.ts
      # to hold the web and native geo maths against each other. Vite transforms
      # that file with ITS tsconfig, which extends expo/tsconfig.base, so without
      # native-app's dependencies the spec cannot even load ("Tsconfig not
      # found"). Same install as the mobile job; scripts skipped, since only the
      # package files are needed here.
      - name: Install native-app dependencies (for the web/native parity spec)
        working-directory: native-app
        run: npm ci --ignore-scripts
      - name: Test web app (wallet-link security matrix + units)
        run: npm test --workspace @furlpay/web
      - name: Build web app
        run: npm run build --workspace @furlpay/web
      - name: Build & test Node SDK
        run: |
          npm run build --workspace @furlpay/furlpay-node
          npm test --workspace @furlpay/furlpay-node
      - name: Test compliance package
        run: npm test --workspace @furlpay/compliance
      - name: Test security package
        run: npm test --workspace @furlpay/security
      - name: Test ledger package
        run: npm test --workspace @furlpay/ledger
      # These two were in the root `npm test` script but NOT here, so their
      # suites never ran on a commit. That matters more than the usual "a test
      # is missing from CI": `npm run deploy:prod` gates on CI reporting success
      # for the exact SHA, so a green CI with these absent is a green light to
      # ship a control-plane or paywall regression. The control-plane package is
      # the deterministic core every authorization decision runs through.
      - name: Test gateway package
        run: npm test --workspace @furlpay/gateway
      - name: Test control-plane package
        run: npm test --workspace @furlpay/control-plane
      # The advisory-lock invariant in cp_record_decision — "two concurrent
      # decisions cannot claim the same position in the evidence chain" — can
      # only be proven against a server with more than one connection. The rest
      # of the database suite runs on an in-process engine where the lock is
      # uncontended by construction, so without this step that invariant is
      # asserted and never executed.
      #
      # Opt-in locally (it starts a real Postgres and costs ~30s), mandatory
      # here: if a security invariant is required before deployment, the test
      # that proves it belongs in the gate rather than in a command someone has
      # to remember.
      - name: Control-plane concurrency (real PostgreSQL, 10/100/500 workers)
        working-directory: apps/web
        env:
          FURLPAY_PG_CONCURRENCY: "1"
        run: npx vitest run src/lib/controlPlane/__tests__/pgConcurrency.spec.ts

  # ---------------------------------------------------------------------------
  # P0 REGRESSION SUITE (docs/release/PRODUCTION_REMEDIATION_STATUS.md).
  #
  # Every production-blocking finding from the 2026-09-30 audit has a test that
  # proves its fix; this job runs all of them and nothing in it is optional.
  # The financial-effect proof needs a REAL multi-connection PostgreSQL — an
  # in-process engine cannot contend a unique index — so it runs against a
  # service container with the actual migration files applied in order.
  # ---------------------------------------------------------------------------
  p0-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: furlpay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # migration immutability compares against the base
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Migration immutability (T-D1) — no committed migration edited
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD~1; fi
          node scripts/db/check-migrations.mjs --base "$BASE"
          node --test scripts/db/check-migrations.test.mjs
      - name: Financial effects on real PostgreSQL (T-W1/T-W2/T-W3/T-L2, 20 repetitions)
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/furlpay_test
        run: node scripts/db/verify-financial-effects.mjs --repeat 20
      - name: Analytics migration 0027 on real PostgreSQL (correctness, privileges, benchmark)
        env:
          ADMIN_URL: postgres://postgres:ci@localhost:5432/postgres
          DATABASE_URL: postgres://postgres:ci@localhost:5432/furlpay_analytics_test
        run: |
          node -e "const pg=require('pg');const c=new pg.Client(process.env.ADMIN_URL);c.connect().then(()=>c.query('create database furlpay_analytics_test')).then(()=>c.end())"
          node scripts/db/verify-analytics.mjs --scale 1000,10000 --events 200000
      - name: AWS env contract (T-A1)
        run: node scripts/aws/check-env-contract.mjs
      - name: AWS edge configuration (cert regions, origin lock, XFF hop model)
        run: node scripts/aws/check-edge-config.mjs
      - name: EAS profile resolution (T-C2)
        run: bash scripts/ci/eas-profile.test.sh
      - name: Web P0/P1 regression specs
        working-directory: apps/web
        run: >-
          npx vitest run
          src/lib/__tests__/adminFallback.spec.ts
          src/lib/__tests__/bootConfig.spec.ts
          src/lib/__tests__/financialEffects.spec.ts
          src/lib/__tests__/safeAddressNeverRecipient.spec.ts
          src/lib/__tests__/handleResolution.spec.ts
          src/lib/__tests__/withDurableWebhook.spec.ts
          src/lib/deposits
          src/lib/cron
          src/app/api/webhooks
      - name: Extension P0 regression (T-E1)
        working-directory: apps/extension
        run: npx vitest run lib/__tests__/receiveAddress.test.ts

  # Security auditing moved to .github/workflows/security-audit.yml
  # which has proper failure handling + Discord notifications.

  # native-app is deliberately NOT an npm workspace (React 19 / react-native
  # must not hoist into the Next.js tree), so `npm install` at the root never
  # touched it and none of its 1000+ tests had ever run in CI. That included the
  # certificate-pinning and release-network-config invariants, which are exactly
  # the kind of control that fails silently: Android IGNORES an expired
  # <pin-set> rather than erroring, so pinning would simply stop applying and
  # nothing would say so.
  # Browser QA. The unit suite cannot see hydration failures, client-side
  # exceptions or real navigation — the /support route-precedence bug shipped
  # green past tsc and 4,500 unit tests, and the /cards infinite spinner was
  # found by screenshotting the page, not by an assertion.
  #
  # Needs NO secrets: playwright.config.ts starts its own dev server with
  # INTEGRATION_MODE=mock and a test-only session secret, and the suite mints its
  # identities through the app's real OTP flow. Mock OTP is refused under
  # NODE_ENV=production, so this cannot work against a production build — which is
  # the guard, not a limitation to route around.
  e2e:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm install
      # --with-deps pulls the system libraries the browser needs on a bare
      # runner; chromium only, matching playwright.config.ts.
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright (desktop + mobile)
        working-directory: apps/web
        run: npx playwright test
      # Traces and screenshots are retained ONLY on failure (see the config), so
      # a green run uploads nothing. They can contain session cookies, which is
      # why the retention is short and the artifact is not public-by-default.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failures
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - working-directory: native-app
        run: npm ci
      - name: Type-check mobile app
        working-directory: native-app
        run: npx tsc --noEmit
      # Includes plugins/__tests__/networkSecurityConfig.test.ts, which fails
      # the build once the pins expire and asserts the dev-host cleartext
      # exception stays out of the release config (FURL-006 / FURL-007).
      - name: Test mobile app
        working-directory: native-app
        run: npx jest --ci

  go-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.21"
      - working-directory: sdks/go
        run: go build ./...

  rust-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - working-directory: sdks/rust
        run: cargo test

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - working-directory: sdks/python
        run: python -c "import furlpay; b='{}'; assert furlpay.construct_event(b, furlpay.sign_payload(b,'s'), 's') == {}"
