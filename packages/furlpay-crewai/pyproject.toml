[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "furlpay-crewai"
version = "0.1.0"
description = "FurlPay tools for CrewAI — stablecoin payments, investing, and x402 agentic payment rails"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FurlPay", email = "hello@furlpay.com" }]
keywords = ["furlpay", "crewai", "payments", "stablecoin", "usdc", "x402", "agents", "ai", "tools", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "crewai>=0.100",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://furlpay.com"
Repository = "https://github.com/furlpay/furlpay-crewai"
Documentation = "https://furlpay.com/docs/mcp"

[tool.setuptools]
packages = ["furlpay_crewai"]
