[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "furlpay-llamaindex"
version = "0.1.0"
description = "FurlPay tools for LlamaIndex — stablecoin payments, investing, and x402 agentic payment rails"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FurlPay", email = "hello@furlpay.com" }]
keywords = ["furlpay", "llamaindex", "llama-index", "payments", "stablecoin", "usdc", "x402", "agents", "ai", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "llama-index-core>=0.10",
]

[project.optional-dependencies]
examples = ["llama-index-llms-anthropic>=0.1"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://furlpay.com"
Repository = "https://github.com/furlpay/furlpay-llamaindex"
Documentation = "https://furlpay.com/docs/mcp"

[tool.setuptools]
packages = ["furlpay_llama"]
