[package]
name = "furlpay-desktop"
version = "0.1.0"
description = "Furlpay desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "2"

[lib]
name = "furlpay_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
