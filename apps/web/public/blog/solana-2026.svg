<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Solana 2026 infrastructure changes: slot time, block compute limit and transaction size are live on mainnet; the Alpenglow consensus upgrade targeting 150 millisecond finality is scheduled, not yet active">
