<text x="92" y="716" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#F2F3F5">Visa never said 70% of its transactions are stablecoins.</text>
<text x="92" y="758" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#8A9099">The ~70% is USDC's share of adjusted stablecoin volume. Visa's own tokenization</text>
<text x="92" y="788" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#8A9099">figure is about card security, and involves no cryptocurrency at all.</text>
<text x="92" y="856" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#5A6069">Sources: Visa Onchain Analytics with Allium Labs &#183; issuer disclosures &#183; furlpay.com</text>
