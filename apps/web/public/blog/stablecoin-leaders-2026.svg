<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Stablecoin market share by two measures: Tether leads market capitalisation at about 59 percent, Circle leads adjusted transaction volume at about 67 percent">
