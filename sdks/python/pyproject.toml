[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "furlpay"
version = "0.1.0"
description = "Official Furlpay server-side SDK for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Furlpay" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["furlpay*"]
